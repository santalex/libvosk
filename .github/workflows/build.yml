name: Build and Distribute LibVosk Multi-Platform

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS (windows, macos, linux, android, all)'
        required: true
        type: choice
        options:
          - 'windows'
          - 'all'
          - 'macos'
          - 'linux'
          - 'android'
        default: 'windows'
      target_arch:
        description: 'Target Arch (x86_64, arm64, x86, all)'
        required: true
        type: choice
        options:
          - 'x86_64'
          - 'all'
          - 'arm64'
          - 'x86'
        default: 'x86_64'
      vosk_tag:
        description: 'Vosk API Git Tag (e.g. v0.3.50)'
        required: true
        default: 'v0.3.50'
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'libvosk-v*'
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  build-vosk-matrix:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos
            arch: arm64
            runner: macos-14
          - os: macos
            arch: x86_64
            runner: macos-14
          # iOS
          - os: ios
            arch: universal
            runner: macos-14
          # tvOS
          - os: tvos
            arch: universal
            runner: macos-14
          # Windows (MSVC Native)
          - os: windows
            arch: x86_64
            runner: windows-2022
          - os: windows
            arch: arm64
            runner: windows-2022
          - os: windows
            arch: x86
            runner: windows-2022
          # Linux
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
          - os: linux
            arch: riscv64
            runner: ubuntu-latest
          - os: linux
            arch: armv7l
            runner: ubuntu-latest
          - os: linux
            arch: x86
            runner: ubuntu-latest
          # Android
          - os: android
            arch: arm64-v8a
            runner: ubuntu-latest
          - os: android
            arch: x86_64
            runner: ubuntu-latest

    steps:
      - name: Checkout Repository
        if: |
          (github.event_name == 'push') ||
          ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
           (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch))
        uses: actions/checkout@v7

      - name: Install macOS Build Tools
        if: |
          (runner.os == 'macOS') &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        run: |
          brew untap aws/tap 2>/dev/null || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake libtool

      - name: Build Vosk Target (macOS / Linux / Android)
        if: |
          (runner.os != 'Windows') &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        run: |
          VOSK_TAG="${{ inputs.vosk_tag || 'v0.3.50' }}"
          ./build.sh --os ${{ matrix.os }} --arch ${{ matrix.arch }} --vosk-tag "${VOSK_TAG}" --yes

      - name: Build Vosk Target (Windows MSVC Native)
        if: |
          (runner.os == 'Windows') &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        shell: powershell
        run: |
          $VOSK_TAG = "${{ inputs.vosk_tag || 'v0.3.50' }}"
          .\src\windows\build.ps1 -Arch "${{ matrix.arch }}" -VoskTag "$VOSK_TAG"

      - name: Upload Target Artifact
        if: |
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        uses: actions/upload-artifact@v7
        with:
          name: vosk-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  assemble-and-release:
    name: Assemble Packages & Publish Release
    needs: build-vosk-matrix
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python Packaging Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel cffi

      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Run Unified Packaging Script
        run: |
          VOSK_TAG="${{ inputs.vosk_tag || github.ref_name || 'v0.3.50' }}"
          VOSK_TAG="${VOSK_TAG}" ./build.sh --only-package

      - name: Upload Packaged Zips
        uses: actions/upload-artifact@v7
        with:
          name: libvosk-packages
          path: packages/

      - name: Create GitHub Release
        if: inputs.create_release || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.vosk_tag || github.ref_name }}
          files: packages/*
          name: LibVosk Unofficial Multi-Platform Prebuilt Release (${{ inputs.vosk_tag || github.ref_name }})
          body: |
            Unofficial high-performance multi-platform (64-bit / 32-bit & cross-architecture) prebuilt binary packages and Python Wheels for Vosk API.

