name: Build and Distribute LibVosk Multi-Platform

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS (windows-msvc, windows-gnu, macos, linux, android, ios, tvos, watchos, visionos, all)'
        required: true
        type: choice
        options:
          - 'all'
          - 'windows-msvc'
          - 'windows-gnu'
          - 'macos'
          - 'linux'
          - 'android'
          - 'ios'
          - 'tvos'
          - 'watchos'
          - 'visionos'
        default: 'all'
      target_arch:
        description: 'Target Arch (x86_64, arm64, x86, universal, all)'
        required: true
        type: choice
        options:
          - 'all'
          - 'x86_64'
          - 'arm64'
          - 'x86'
          - 'universal'
        default: 'all'
      vosk_tag:
        description: 'Vosk API Git Tag (e.g. v0.3.50)'
        required: true
        default: 'v0.3.50'
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'libvosk-v*'
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  build-vosk-matrix:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos
            arch: arm64
            runner: macos-14
          - os: macos
            arch: x86_64
            runner: macos-14
          # iOS
          - os: ios
            arch: universal
            runner: macos-14
          # tvOS
          - os: tvos
            arch: universal
            runner: macos-14
          # watchOS
          - os: watchos
            arch: universal
            runner: macos-14
          # visionOS
          - os: visionos
            arch: universal
            runner: macos-14
          # Windows (MSVC Native)
          - os: windows-msvc
            arch: x86_64
            runner: windows-2022
          - os: windows-msvc
            arch: arm64
            runner: windows-2022
          - os: windows-msvc
            arch: x86
            runner: windows-2022
          # Windows (GNU MinGW Cross)
          - os: windows-gnu
            arch: x86_64
            runner: ubuntu-latest
          - os: windows-gnu
            arch: x86
            runner: ubuntu-latest
          - os: windows-gnu
            arch: arm64
            runner: ubuntu-latest
          # Linux
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
          - os: linux
            arch: riscv64
            runner: ubuntu-latest
          - os: linux
            arch: armv7l
            runner: ubuntu-latest
          - os: linux
            arch: x86
            runner: ubuntu-latest
          # Android
          - os: android
            arch: arm64-v8a
            runner: ubuntu-latest
          - os: android
            arch: x86_64
            runner: ubuntu-latest

    steps:
      - name: Checkout Repository
        if: |
          (github.event_name == 'push') ||
          ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
           (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch))
        uses: actions/checkout@v7

      - name: Install macOS Build Tools
        if: |
          (runner.os == 'macOS') &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        run: |
          brew untap aws/tap 2>/dev/null || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake libtool

      - name: Setup MSVC Environment
        if: |
          (runner.os == 'Windows') &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x86' && 'x86' || (matrix.arch == 'arm64' && 'arm64' || 'x64') }}

      - name: Build Vosk Target (macOS / Linux / Android / Windows-GNU)
        if: |
          (runner.os != 'Windows') &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        run: |
          VOSK_TAG="${{ inputs.vosk_tag || 'v0.3.50' }}"
          ./build.sh --os ${{ matrix.os }} --arch ${{ matrix.arch }} --vosk-tag "${VOSK_TAG}" --yes

      - name: Run E2E Tests (macOS & Linux Native)
        if: |
          ((runner.os == 'macOS' && matrix.os == 'macos') || (runner.os == 'Linux' && matrix.os == 'linux' && matrix.arch == 'x86_64')) &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        run: |
          if [ "${{ matrix.os }}" = "macos" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            # arm64: runner 是 ARM 原生硬件，直接执行
            ./tests/run_tests.sh dist/macos/arm64
          elif [ "${{ matrix.os }}" = "macos" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            # x86_64: runner 是 macos-14 ARM，通过 Rosetta 2 执行 x86_64 二进制
            arch -x86_64 ./tests/run_tests.sh dist/macos/x86_64
          elif [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            ./tests/run_tests.sh dist/linux/x86_64
          fi

      - name: Build Vosk Target (Windows MSVC Native)
        if: |
          (runner.os == 'Windows') &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        shell: powershell
        run: |
          $VOSK_TAG = "${{ inputs.vosk_tag || 'v0.3.50' }}"
          .\src\windows-msvc\build.ps1 -Arch "${{ matrix.arch }}" -VoskTag "$VOSK_TAG"

      - name: Run E2E Tests (Windows MSVC Native)
        if: |
          (runner.os == 'Windows' && matrix.arch == 'x86_64') &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        shell: powershell
        run: |
          $testSrc = "tests\test_vosk_e2e.c"
          $incDir = "src\windows-msvc\deps\vosk-api\src"
          $libDir = "dist\windows-msvc\x86_64"
          $modelDir = "tests\model"
          $wavFile = "tests\test.wav"
          
          if (-not (Test-Path $wavFile)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/alphacep/vosk-api/master/python/example/test.wav" -OutFile $wavFile -UseBasicParsing
          }
          if (-not (Test-Path "$modelDir\am\final.mdl")) {
            if (Test-Path "tests\model.zip") {
              Expand-Archive -Path "tests\model.zip" -DestinationPath "tests" -Force
            } else {
              Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" -OutFile "tests\model.zip" -UseBasicParsing
              Expand-Archive -Path "tests\model.zip" -DestinationPath "tests\model_tmp" -Force
              Move-Item "tests\model_tmp\vosk-model-small-en-us-0.15" $modelDir -Force
              Remove-Item "tests\model_tmp" -Recurse -Force
            }
          }
          
          $implib = if (Test-Path "$libDir\libvosk_dll.lib") { "libvosk_dll.lib" } else { "libvosk.lib" }
          & cl.exe /nologo /MD /O2 /I"$incDir" "$testSrc" /link /LIBPATH:"$libDir" $implib /OUT:"tests\test_e2e.exe"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Test compilation failed with exit code $LASTEXITCODE"
            exit 1
          }
          Copy-Item "$libDir\*.dll" "tests\" -Force -ErrorAction SilentlyContinue
          $testExe = (Resolve-Path "tests\test_e2e.exe").Path
          & $testExe (Resolve-Path $modelDir) (Resolve-Path $wavFile)
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Test execution failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Upload Target Artifact
        if: |
          always() &&
          ((github.event_name == 'push') ||
           ((inputs.target_os == 'all' || inputs.target_os == matrix.os) &&
            (inputs.target_arch == 'all' || inputs.target_arch == matrix.arch)))
        uses: actions/upload-artifact@v7
        with:
          name: vosk-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  assemble-and-release:
    name: Assemble Packages & Publish Release
    needs: build-vosk-matrix
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python Packaging Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel cffi

      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Run Unified Packaging Script
        run: |
          VOSK_TAG="${{ inputs.vosk_tag || github.ref_name || 'v0.3.50' }}"
          VOSK_TAG="${VOSK_TAG}" ./build.sh --only-package

      - name: Upload Packaged Zips
        uses: actions/upload-artifact@v7
        with:
          name: libvosk-packages
          path: packages/

      - name: Create GitHub Release
        if: inputs.create_release || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.vosk_tag || github.ref_name }}
          files: packages/*
          name: LibVosk Unofficial Multi-Platform Prebuilt Release (${{ inputs.vosk_tag || github.ref_name }})
          body: |
            Unofficial high-performance multi-platform (64-bit / 32-bit & cross-architecture) prebuilt binary packages and Python Wheels for Vosk API.

