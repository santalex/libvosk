name: Build and Distribute LibVosk Multi-Platform

on:
  workflow_dispatch:
    inputs:
      vosk_tag:
        description: 'Vosk API Git Tag (e.g. v0.3.50)'
        required: true
        default: 'v0.3.50'
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'libvosk-v*'
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-vosk-matrix:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos
            arch: arm64
            runner: macos-14
          - os: macos
            arch: x86_64
            runner: macos-14
          # iOS
          - os: ios
            arch: universal
            runner: macos-14
          # tvOS
          - os: tvos
            arch: universal
            runner: macos-14
          # Windows
          - os: windows
            arch: x86_64
            runner: ubuntu-latest
          - os: windows
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: x86
            runner: ubuntu-latest
          # Linux
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: aarch64
            runner: ubuntu-latest
          - os: linux
            arch: riscv64
            runner: ubuntu-latest
          - os: linux
            arch: armv7l
            runner: ubuntu-latest
          - os: linux
            arch: x86
            runner: ubuntu-latest
          # Android
          - os: android
            arch: arm64-v8a
            runner: ubuntu-latest
          - os: android
            arch: x86_64
            runner: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install macOS Build Tools
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool

      - name: Build Vosk Target
        run: |
          VOSK_TAG="${{ inputs.vosk_tag || 'v0.3.50' }}"
          ./build.sh --os ${{ matrix.os }} --arch ${{ matrix.arch }} --vosk-tag "${VOSK_TAG}" --yes

      - name: Upload Target Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vosk-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/${{ matrix.os }}/${{ matrix.arch }}/
            dist/apple/${{ matrix.os }}/${{ matrix.arch }}/
            dist/apple/ios/
            dist/apple/tvos/

  assemble-and-release:
    name: Assemble Artifacts & Publish Release
    needs: build-vosk-matrix
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@v4
        with:
          path: download_dist/

      - name: Assemble Separated (Shared/Static/XCFramework) Packages & Python Wheels
        run: |
          mkdir -p release_packages
          VOSK_TAG="${{ inputs.vosk_tag || github.ref_name || 'v0.3.50' }}"
          
          # 1. 针对 Windows / Linux / Android 平台，拆分 shared (动态库) 与 static (静态库) 压缩包
          for dir in download_dist/vosk-*; do
            if [ -d "$dir" ]; then
              target_name=$(basename "$dir" | sed "s/vosk-//")
              
              # 跳过 macOS / iOS / tvOS，它们由后方 Apple 逻辑专属打包
              if [[ "$target_name" == macos* ]] || [[ "$target_name" == ios* ]] || [[ "$target_name" == tvos* ]]; then
                continue
              fi

              pkg_prefix="libvosk-${VOSK_TAG}-${target_name}"
              echo "Processing $target_name -> ${pkg_prefix} ..."

              # A. 提取 Shared 动态库包 (.so / .dll / .lib / header)
              mkdir -p tmp_shared
              find "$dir" -maxdepth 4 \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" -o -name "libvosk.lib" \) -exec cp -f {} tmp_shared/ \; 2>/dev/null || true
              if ls tmp_shared/*.so tmp_shared/*.dll tmp_shared/*.dylib tmp_shared/libvosk.lib 1>/dev/null 2>&1; then
                find "$dir" -maxdepth 4 -name "vosk_api.h" -exec cp -f {} tmp_shared/ \; 2>/dev/null || true
                (cd tmp_shared && zip -r "../../release_packages/${pkg_prefix}-shared.zip" .)
              fi
              rm -rf tmp_shared

              # B. 提取 Static 纯静态库包 (.a / libvosk_static.lib / header)
              mkdir -p tmp_static
              find "$dir" -maxdepth 4 \( -name "*.a" -o -name "libvosk_static.lib" \) -exec cp -f {} tmp_static/ \; 2>/dev/null || true
              rm -f tmp_static/*.dll.a
              if ls tmp_static/*.a tmp_static/libvosk_static.lib 1>/dev/null 2>&1; then
                find "$dir" -maxdepth 4 -name "vosk_api.h" -exec cp -f {} tmp_static/ \; 2>/dev/null || true
                (cd tmp_static && zip -r "../../release_packages/${pkg_prefix}-static.zip" .)
              fi
              rm -rf tmp_static
            fi
          done

          # 2. macOS 平台单架构 (arm64 / x86_64) 动态与静态库拆分
          for mac_arch in arm64 x86_64; do
            mac_dir=$(find download_dist/ -type d -name "vosk-macos-${mac_arch}" 2>/dev/null | head -n 1)
            if [ -n "$mac_dir" ] && [ -d "$mac_dir" ]; then
              pkg_prefix="libvosk-${VOSK_TAG}-macos-${mac_arch}"
              
              # A. macOS Shared 动态库包 (.dylib + header)
              mkdir -p tmp_mac_shared
              find "$mac_dir" -maxdepth 4 -name "*.dylib" -exec cp -f {} tmp_mac_shared/ \; 2>/dev/null || true
              if ls tmp_mac_shared/*.dylib 1>/dev/null 2>&1; then
                find "$mac_dir" -maxdepth 4 -name "vosk_api.h" -exec cp -f {} tmp_mac_shared/ \; 2>/dev/null || true
                (cd tmp_mac_shared && zip -r "../../release_packages/${pkg_prefix}-shared.zip" .)
              fi
              rm -rf tmp_mac_shared

              # B. macOS Static 纯静态库包 (.a + header)
              mkdir -p tmp_mac_static
              find "$mac_dir" -maxdepth 4 -name "*.a" -exec cp -f {} tmp_mac_static/ \; 2>/dev/null || true
              if ls tmp_mac_static/*.a 1>/dev/null 2>&1; then
                find "$mac_dir" -maxdepth 4 -name "vosk_api.h" -exec cp -f {} tmp_mac_static/ \; 2>/dev/null || true
                (cd tmp_mac_static && zip -r "../../release_packages/${pkg_prefix}-static.zip" .)
              fi
              rm -rf tmp_mac_static
            fi
          done

          # 3. macOS Universal (Universal .dylib / Universal .a / macOS .xcframework 拆分)
          mac_arm64_dylib=$(find download_dist/ -path "*/vosk-macos-arm64/*" -name "libvosk.dylib" | head -n 1)
          mac_x86_dylib=$(find download_dist/ -path "*/vosk-macos-x86_64/*" -name "libvosk.dylib" | head -n 1)
          mac_arm64_a=$(find download_dist/ -path "*/vosk-macos-arm64/*" -name "libvosk.a" | head -n 1)
          mac_x86_a=$(find download_dist/ -path "*/vosk-macos-x86_64/*" -name "libvosk.a" | head -n 1)
          mac_header=$(find download_dist/ -path "*/vosk-macos-arm64/*" -name "vosk_api.h" | head -n 1)

          if [ -n "$mac_arm64_dylib" ] && [ -n "$mac_x86_dylib" ]; then
            echo "Synthesizing macOS Universal binary & XCFramework..."
            mkdir -p download_dist/vosk-macos-universal
            cp "$mac_header" download_dist/vosk-macos-universal/ 2>/dev/null || true
            
            lipo -create "$mac_arm64_dylib" "$mac_x86_dylib" -output download_dist/vosk-macos-universal/libvosk.dylib
            lipo -create "$mac_arm64_a" "$mac_x86_a" -output download_dist/vosk-macos-universal/libvosk.a
            
            mkdir -p tmp_headers && cp "$mac_header" tmp_headers/
            xcodebuild -create-xcframework \
                -library download_dist/vosk-macos-universal/libvosk.a \
                -headers tmp_headers \
                -output download_dist/vosk-macos-universal/libvosk.xcframework 2>/dev/null || true
            rm -rf tmp_headers

            # A. Universal Shared 包 (.dylib + header)
            mkdir -p tmp_uni_shared
            cp download_dist/vosk-macos-universal/vosk_api.h tmp_uni_shared/ 2>/dev/null || true
            cp download_dist/vosk-macos-universal/libvosk.dylib tmp_uni_shared/ 2>/dev/null || true
            if ls tmp_uni_shared/*.dylib 1>/dev/null 2>&1; then
              (cd tmp_uni_shared && zip -r "../../release_packages/libvosk-${VOSK_TAG}-macos-universal-shared.zip" .)
            fi
            rm -rf tmp_uni_shared

            # B. Universal Static 纯静态库包 (.a + header)
            mkdir -p tmp_uni_static
            cp download_dist/vosk-macos-universal/vosk_api.h tmp_uni_static/ 2>/dev/null || true
            cp download_dist/vosk-macos-universal/libvosk.a tmp_uni_static/ 2>/dev/null || true
            if ls tmp_uni_static/*.a 1>/dev/null 2>&1; then
              (cd tmp_uni_static && zip -r "../../release_packages/libvosk-${VOSK_TAG}-macos-universal-static.zip" .)
            fi
            rm -rf tmp_uni_static

            # C. macOS 专属 XCFramework 包 (.xcframework + header)
            mkdir -p tmp_mac_xcf
            cp download_dist/vosk-macos-universal/vosk_api.h tmp_mac_xcf/ 2>/dev/null || true
            cp -R download_dist/vosk-macos-universal/libvosk.xcframework tmp_mac_xcf/ 2>/dev/null || true
            if [ -d "tmp_mac_xcf/libvosk.xcframework" ]; then
              (cd tmp_mac_xcf && zip -r "../../release_packages/libvosk-${VOSK_TAG}-macos-xcframework.zip" .)
            fi
            rm -rf tmp_mac_xcf
          fi

          # 4. iOS 平台 (纯静态库 -static.zip 与 专属 -xcframework.zip 拆分)
          ios_dir=$(find download_dist/ -type d -name "vosk-ios-universal" 2>/dev/null | head -n 1)
          if [ -n "$ios_dir" ] && [ -d "$ios_dir" ]; then
            # A. iOS 纯静态库包 (.a + header)
            mkdir -p tmp_ios_static
            find "$ios_dir" -name "vosk_api.h" -exec cp -f {} tmp_ios_static/ \; 2>/dev/null || true
            find "$ios_dir" -type d \( -name "iphoneos_arm64" -o -name "iphonesimulator_universal" \) -exec cp -Rf {} tmp_ios_static/ \; 2>/dev/null || true
            if ls tmp_ios_static/*/*.a 1>/dev/null 2>&1; then
              (cd tmp_ios_static && zip -r "../../release_packages/libvosk-${VOSK_TAG}-ios-static.zip" .)
            fi
            rm -rf tmp_ios_static

            # B. iOS 专属 XCFramework 包 (.xcframework + header)
            mkdir -p tmp_ios_xcf
            find "$ios_dir" -name "vosk_api.h" -exec cp -f {} tmp_ios_xcf/ \; 2>/dev/null || true
            find "$ios_dir" -type d -name "libvosk.xcframework" -exec cp -Rf {} tmp_ios_xcf/ \; 2>/dev/null || true
            if [ -d "tmp_ios_xcf/libvosk.xcframework" ]; then
              (cd tmp_ios_xcf && zip -r "../../release_packages/libvosk-${VOSK_TAG}-ios-xcframework.zip" .)
            fi
            rm -rf tmp_ios_xcf
          fi

          # 5. tvOS 平台 (纯静态库 -static.zip 与 专属 -xcframework.zip 拆分)
          tvos_dir=$(find download_dist/ -type d -name "vosk-tvos-universal" 2>/dev/null | head -n 1)
          if [ -n "$tvos_dir" ] && [ -d "$tvos_dir" ]; then
            # A. tvOS 纯静态库包 (.a + header)
            mkdir -p tmp_tvos_static
            find "$tvos_dir" -name "vosk_api.h" -exec cp -f {} tmp_tvos_static/ \; 2>/dev/null || true
            find "$tvos_dir" -type d \( -name "appletvos_arm64" -o -name "appletvsimulator_universal" \) -exec cp -Rf {} tmp_tvos_static/ \; 2>/dev/null || true
            if ls tmp_tvos_static/*/*.a 1>/dev/null 2>&1; then
              (cd tmp_tvos_static && zip -r "../../release_packages/libvosk-${VOSK_TAG}-tvos-static.zip" .)
            fi
            rm -rf tmp_tvos_static

            # B. tvOS 专属 XCFramework 包 (.xcframework + header)
            mkdir -p tmp_tvos_xcf
            find "$tvos_dir" -name "vosk_api.h" -exec cp -f {} tmp_tvos_xcf/ \; 2>/dev/null || true
            find "$tvos_dir" -type d -name "libvosk.xcframework" -exec cp -Rf {} tmp_tvos_xcf/ \; 2>/dev/null || true
            if [ -d "tmp_tvos_xcf/libvosk.xcframework" ]; then
              (cd tmp_tvos_xcf && zip -r "../../release_packages/libvosk-${VOSK_TAG}-tvos-xcframework.zip" .)
            fi
            rm -rf tmp_tvos_xcf
          fi

          # 6. Apple 全平台 (macOS + iOS + tvOS) Super XCFramework 大一统包 (重命名为 -apple-xcframework.zip)
          if [ -d "download_dist/vosk-macos-universal" ] && [ -n "$ios_dir" ]; then
            echo "Synthesizing Apple Super XCFramework..."
            mkdir -p download_dist/vosk-apple-universal
            cp "$mac_header" download_dist/vosk-apple-universal/ 2>/dev/null || true
            cp download_dist/vosk-macos-universal/libvosk.dylib download_dist/vosk-apple-universal/ 2>/dev/null || true

            mkdir -p tmp_headers && cp "$mac_header" tmp_headers/
            
            XCF_CMD=(xcodebuild -create-xcframework)
            if [ -f "download_dist/vosk-macos-universal/libvosk.a" ]; then
              XCF_CMD+=(-library download_dist/vosk-macos-universal/libvosk.a -headers tmp_headers)
            fi
            
            ios_arm64_a=$(find download_dist/ -path "*/iphoneos_arm64/*" -name "libvosk.a" | head -n 1)
            ios_sim_a=$(find download_dist/ -path "*/iphonesimulator_universal/*" -name "libvosk.a" | head -n 1)
            tvos_arm64_a=$(find download_dist/ -path "*/appletvos_arm64/*" -name "libvosk.a" | head -n 1)
            tvos_sim_a=$(find download_dist/ -path "*/appletvsimulator_universal/*" -name "libvosk.a" | head -n 1)

            if [ -n "$ios_arm64_a" ]; then XCF_CMD+=(-library "$ios_arm64_a" -headers tmp_headers); fi
            if [ -n "$ios_sim_a" ]; then XCF_CMD+=(-library "$ios_sim_a" -headers tmp_headers); fi
            if [ -n "$tvos_arm64_a" ]; then XCF_CMD+=(-library "$tvos_arm64_a" -headers tmp_headers); fi
            if [ -n "$tvos_sim_a" ]; then XCF_CMD+=(-library "$tvos_sim_a" -headers tmp_headers); fi
            XCF_CMD+=(-output download_dist/vosk-apple-universal/libvosk.xcframework)

            "${XCF_CMD[@]}" 2>/dev/null || true
            rm -rf tmp_headers

            (cd download_dist/vosk-apple-universal && zip -r "../../release_packages/libvosk-${VOSK_TAG}-apple-xcframework.zip" .)
          fi

          # 7. 自动为各平台组装 3 级梯度的 Python Wheel 预编译包 (.whl)
          echo "Packaging Python Wheels for all platform targets & Universal Wheels..."
          pip install setuptools wheel cffi 2>/dev/null || true
          
          # A. 第一梯度：单目标特定小 Wheel 包 (Single Target)
          for dir in download_dist/vosk-*; do
            if [ -d "$dir" ]; then
              target_name=$(basename "$dir" | sed "s/vosk-//")
              
              # 跳过通用 Universal 目录（交给第二、三梯度处理）
              if [[ "$target_name" == *"universal"* ]]; then
                continue
              fi

              dylib_file=$(find "$dir" -maxdepth 4 \( -name "*.dylib" -o -name "*.so" -o -name "*.dll" \) 2>/dev/null | head -n 1)
              
              if [ -n "$dylib_file" ]; then
                echo "Building Single Target Python Wheel for ${target_name} ..."
                rm -rf tmp_py_build && mkdir -p tmp_py_build/vosk
                cp -R src/python/vosk/* tmp_py_build/vosk/
                cp src/python/setup.py tmp_py_build/
                cp "$dylib_file" tmp_py_build/vosk/
                
                (cd tmp_py_build && VOSK_TAG="${VOSK_TAG}" python3 setup.py bdist_wheel --plat-name="${target_name//-/_}") 2>/dev/null || true
                cp tmp_py_build/dist/*.whl release_packages/ 2>/dev/null || true
                rm -rf tmp_py_build
              fi
            fi
          done

          # B. 第二梯度：系统 Ecosystem 合并 Wheel 包 (macosx_universal / win_universal / linux_universal / android_universal)
          for os_sys in macos windows linux android; do
            echo "Building OS-Universal Python Wheel for ${os_sys} ..."
            rm -rf tmp_os_build && mkdir -p tmp_os_build/vosk/lib
            cp -R src/python/vosk/* tmp_os_build/vosk/
            cp src/python/setup.py tmp_os_build/
            
            # 搜集当前 OS 下的所有架构动态库放入 lib/<os>_<arch>/
            found_count=0
            for dylib_path in $(find download_dist/ -name "*.dylib" -o -name "*.so" -o -name "*.dll" 2>/dev/null); do
              if [[ "$dylib_path" == *"${os_sys}"* ]] || ([[ "$os_sys" == "macos" ]] && [[ "$dylib_path" == *"apple"* ]]); then
                arch_sub=$(basename $(dirname "$dylib_path"))
                mkdir -p "tmp_os_build/vosk/lib/${os_sys}_${arch_sub}"
                cp -f "$dylib_path" "tmp_os_build/vosk/lib/${os_sys}_${arch_sub}/"
                found_count=$((found_count + 1))
              fi
            done

            if [ $found_count -gt 0 ]; then
              plat_out="${os_sys}_universal"
              if [ "$os_sys" = "macos" ]; then plat_out="macosx_universal"; fi
              (cd tmp_os_build && VOSK_TAG="${VOSK_TAG}" python3 setup.py bdist_wheel --plat-name="${plat_out}") 2>/dev/null || true
              cp tmp_os_build/dist/*.whl release_packages/ 2>/dev/null || true
            fi
            rm -rf tmp_os_build
          done

          # C. 第三梯度：全平台大一统 Super Universal Wheel 包 (vosk-*-py3-none-any.whl, ~52MB)
          echo "Building Super Universal All-in-One Python Wheel (py3-none-any.whl) ..."
          rm -rf tmp_all_build && mkdir -p tmp_all_build/vosk/lib
          cp -R src/python/vosk/* tmp_all_build/vosk/
          cp src/python/setup.py tmp_all_build/
          
          for dylib_path in $(find download_dist/ -name "*.dylib" -o -name "*.so" -o -name "*.dll" 2>/dev/null); do
            target_sub=$(basename $(dirname "$dylib_path"))
            os_sub=$(basename $(dirname $(dirname "$dylib_path")) | sed "s/vosk-//")
            mkdir -p "tmp_all_build/vosk/lib/${os_sub}_${target_sub}"
            cp -f "$dylib_path" "tmp_all_build/vosk/lib/${os_sub}_${target_sub}/"
          done

          (cd tmp_all_build && VOSK_TAG="${VOSK_TAG}" python3 setup.py bdist_wheel --plat-name="any") 2>/dev/null || true
          cp tmp_all_build/dist/*.whl release_packages/ 2>/dev/null || true
          rm -rf tmp_all_build

          # 8. 生成 SHA256 校验和目录文件
          cd release_packages
          shasum -a 256 * > SHA256SUMS.txt
          echo "=============================================================================="
          echo "  Release Packages List (${VOSK_TAG}):"
          echo "=============================================================================="
          ls -lh

      - name: Create GitHub Release
        if: inputs.create_release || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_packages/*
          name: LibVosk Unofficial Multi-Platform Prebuilt Release (${{ inputs.vosk_tag || github.ref_name }})
          body: |
            Unofficial high-performance multi-platform (64-bit / 32-bit & cross-architecture) prebuilt binary packages for Vosk API.
